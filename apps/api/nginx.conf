events {}

http {
    
    # -------------------------------------------------
    # Upstreams – one per micro‑service
    # -------------------------------------------------
    upstream auth_service {
        # Docker DNS name + internal port
        server auth-service:4001;
    }

    upstream api_service {
        server api:4000;   # your existing monolith
    }

    # -------------------------------------------------
    # Server block (listens on port 80 or 443)
    # -------------------------------------------------
    server {
        listen 80;
        server_name localhost;   # change to your domain in prod

        # -------------------------------------------------
        # Proxy /auth/* to the Auth Service
        # -------------------------------------------------
        location /auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------
        # Existing routes that go to the monolith
        # -------------------------------------------------
        location / {
            proxy_pass http://api_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------
        # (Optional) static assets, health checks, etc.
        # -------------------------------------------------
        location /static/ {
            alias /usr/share/nginx/html/static/;
        }
    }
}