events {}

http {

    # -------------------------------------------------
    # Upstreams – one per micro‑service
    # -------------------------------------------------
    upstream auth_service {
        # Docker DNS name + internal port
        server auth-service:4001;
    }

    upstream user_service {
        server user-service:4002;
    }

    upstream api_service {
        server api:4000;
    }

    # -------------------------------------------------
    # Server block (listens on port 80 or 443)
    # -------------------------------------------------
    server {
        listen 80;
        server_name localhost;   # change to your domain in prod

        # -------------------------------------------------
        # Proxy /api/auth/* to the Auth Service
        # -------------------------------------------------
        location /api/auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------
        # Proxy /api/users/* to the User Service
        # -------------------------------------------------
        location /api/users/ {
            proxy_pass http://user_service/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------
        # Proxy /api/* to API service
        # -------------------------------------------------
        location /api/ {
            proxy_pass http://api_service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------
        # Socket.IO WebSocket support
        # -------------------------------------------------
        location /socket.io/ {
            proxy_pass http://api_service/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------
        # Health check and root
        # -------------------------------------------------
        location /health {
            proxy_pass http://api_service/health;
        }

        location / {
            return 404;
        }
    }
}